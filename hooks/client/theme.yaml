themes:
  light:
    variables:
      bg: "#f8fafc"
      foreground: "#0f172a"
      card: "#ffffff"
      muted: "#64748b"
      primary: "#2563eb"
      primaryFg: "#f8fafc"
      secondary: "#f1f5f9"
      secondaryFg: "#1e293b"
      border: "#e2e8f0"
      badgeActive: "#22c55e"
      badgePublished: "#3b82f6"
      badgePlanned: "#eab308"
    breakpoints:
      sm: "640px"
      md: "768px"
      lg: "1024px"
    selectors:
      body:
        backgroundColor: "var(bg)"
        color: "var(foreground)"
        fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        lineHeight: "1.5"
        margin: 0
      ".ct-page":
        backgroundColor: "var(bg)"
        color: "var(foreground)"
        minHeight: "100vh"
      ".ct-container":
        maxWidth: "64rem"
        marginLeft: "auto"
        marginRight: "auto"
        padding: "4rem 1rem"
        width: "100%"
        boxSizing: "border-box"
      ".ct-header":
        marginBottom: "5rem"
      ".ct-header-top":
        display: "flex"
        flexDirection: "column"
        flexWrap: "wrap"
        alignItems: "center"
        justifyContent: "space-between"
        gap: "1.5rem"
        marginBottom: "1.5rem"
      ".ct-header-top-row":
        flexDirection: "row"
        alignItems: "flex-end"
      ".ct-identity":
        display: "flex"
        flexDirection: "row"
        alignItems: "center"
        justifyContent: "center"
        gap: "1.5rem"
        textAlign: "center"
      ".ct-identity-text":
        display: "flex"
        flexDirection: "column"
        gap: "0.5rem"
        textAlign: "center"
      ".ct-identity-text-left":
        textAlign: "left"
      ".ct-name":
        fontSize: "clamp(3rem, 6vw, 3.75rem)"
        fontWeight: "800"
        letterSpacing: "-0.04em"
        margin: 0
        lineHeight: "1"
      ".ct-title":
        fontSize: "clamp(1.25rem, 3vw, 1.5rem)"
        fontWeight: "500"
        margin: 0
      ".ct-actions":
        display: "flex"
        flexWrap: "wrap"
        alignItems: "center"
        justifyContent: "center"
        gap: "0.75rem"
      ".ct-print-actions":
        display: "flex"
        flexWrap: "wrap"
        alignItems: "center"
        gap: "0.5rem"
      ".ct-icon-btn":
        display: "inline-flex"
        alignItems: "center"
        justifyContent: "center"
        width: "2.625rem"
        height: "2.625rem"
        padding: 0
        boxSizing: "border-box"
        borderRadius: "9999px"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
        cursor: "pointer"
      ".ct-icon-btn-placeholder":
        width: "2.5rem"
        height: "2.5rem"
        borderRadius: "9999px"
        backgroundColor: "var(secondary)"
      ".ct-action-btn":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.5rem"
        padding: "0.625rem 1rem"
        boxSizing: "border-box"
        borderRadius: "9999px"
        fontSize: "0.875rem"
        fontWeight: "600"
        fontFamily: "inherit"
        lineHeight: "1.25rem"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        textDecoration: "none"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
        cursor: "pointer"
        boxShadow: "0 1px 2px rgba(15, 23, 42, 0.08)"
      ".ct-bio":
        fontSize: "1.125rem"
        lineHeight: "1.625"
        margin: "0 auto"
        textAlign: "center"
      ".ct-bio-left":
        textAlign: "left"
        marginLeft: 0
        marginRight: 0
      ".ct-contacts":
        display: "flex"
        flexWrap: "wrap"
        justifyContent: "center"
        gap: "1rem"
        marginTop: "1.5rem"
      ".ct-contacts-left":
        justifyContent: "flex-start"
      ".ct-chip":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.5rem"
        padding: "0.375rem 0.75rem"
        boxSizing: "border-box"
        borderRadius: "9999px"
        fontSize: "0.875rem"
        fontWeight: "500"
        lineHeight: "1.25rem"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        textDecoration: "none"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
      ".ct-muted":
        color: "var(muted)"
      ".ct-card":
        backgroundColor: "var(card)"
        color: "var(foreground)"
        borderColor: "var(border)"
        borderWidth: 1
        borderStyle: "solid"
        borderRadius: "0.5rem"
        padding: "1.5rem"
        boxShadow: "0 1px 2px rgba(15, 23, 42, 0.06)"
        display: "flex"
        flexDirection: "column"
        boxSizing: "border-box"
      ".ct-project-card":
        height: "100%"
      ".ct-card-head":
        display: "flex"
        justifyContent: "space-between"
        alignItems: "flex-start"
        gap: "0.75rem"
        marginBottom: "0.5rem"
      ".ct-card-title":
        fontSize: "1.25rem"
        fontWeight: "700"
        lineHeight: "1.75rem"
        margin: 0
      ".ct-card-links":
        display: "flex"
        flexWrap: "wrap"
        gap: "1rem"
        marginTop: "auto"
      ".ct-primary":
        backgroundColor: "var(primary)"
        color: "var(primaryFg)"
        borderColor: "var(primary)"
        borderWidth: 0
        boxShadow: "0 4px 6px rgba(37, 99, 235, 0.25)"
      ".ct-secondary":
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
      ".ct-border":
        borderColor: "var(border)"
      ".ct-link":
        color: "var(foreground)"
        textDecoration: "none"
        fontSize: "0.875rem"
        lineHeight: "1.25rem"
      ".ct-link-row":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.25rem"
      ".ct-lib-card":
        padding: "1rem"
        gap: "0.5rem"
        minHeight: "8.375rem"
      ".ct-lib-name":
        display: "flex"
        alignItems: "center"
        gap: "0.75rem"
      ".ct-lib-icon":
        color: "var(primary)"
        display: "inline-flex"
      ".ct-lib-mono":
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace"
        fontWeight: "700"
        fontSize: "1.125rem"
      ".ct-icon-link":
        display: "inline-flex"
        alignItems: "center"
        justifyContent: "center"
        padding: "0.5rem"
        borderRadius: "9999px"
        color: "var(foreground)"
        textDecoration: "none"
      ".ct-badge":
        fontSize: "0.75rem"
        fontWeight: "600"
        borderRadius: "9999px"
        padding: "0.15rem 0.6rem"
        textTransform: "lowercase"
        whiteSpace: "nowrap"
      ".ct-badge-active":
        backgroundColor: "var(badgeActive)"
        color: "#052e16"
      ".ct-badge-published":
        backgroundColor: "var(badgePublished)"
        color: "#eff6ff"
      ".ct-badge-planned":
        backgroundColor: "var(badgePlanned)"
        color: "#422006"
      ".ct-section":
        marginBottom: "3rem"
      ".ct-section-title":
        fontSize: "1.875rem"
        fontWeight: "700"
        lineHeight: "2.25rem"
        marginBottom: "1.5rem"
        paddingBottom: "0.5rem"
        borderBottomWidth: 1
        borderBottomStyle: "solid"
        borderBottomColor: "var(border)"
      ".ct-projects":
        display: "grid"
        gridTemplateColumns: "1fr"
        gap: "1.5rem"
      ".ct-projects-md":
        gridTemplateColumns: "1fr 1fr"
      ".ct-libraries":
        display: "grid"
        gridTemplateColumns: "1fr"
        gap: "1rem"
      ".ct-libraries-md":
        gridTemplateColumns: "1fr 1fr"
      ".ct-lib-row":
        display: "flex"
        alignItems: "center"
        justifyContent: "space-between"
        gap: "0.75rem"
      ".ct-lib-links":
        display: "flex"
        gap: "0.5rem"
      ".ct-resume-grid":
        display: "grid"
        gridTemplateColumns: "1fr"
        gap: "2rem"
        fontSize: "0.875rem"
      ".ct-resume-md":
        gridTemplateColumns: "2fr 1fr"
      ".ct-footer":
        marginTop: "5rem"
        paddingTop: "2rem"
        borderTopWidth: 1
        borderTopStyle: "solid"
        borderTopColor: "var(border)"
        textAlign: "center"
        fontSize: "0.875rem"
      "h1, h2, h3, h4, p, span, a, button, li, blockquote":
        color: "inherit"
      ".pt-shell":
        backgroundColor: "var(bg)"
        color: "var(foreground)"
        minHeight: "100vh"
        display: "flex"
        flexDirection: "column"
      ".pt-shell-body":
        flex: 1
        display: "flex"
        flexDirection: "column"
        minHeight: 0
      ".pt-site-nav":
        position: "sticky"
        top: 0
        zIndex: 100
        width: "100%"
        borderBottomWidth: 1
        borderBottomStyle: "solid"
        borderBottomColor: "var(border)"
        backgroundColor: "var(secondary)"
      ".pt-nav-inner":
        maxWidth: "80rem"
        marginLeft: "auto"
        marginRight: "auto"
        padding: "0 1rem"
        display: "flex"
        alignItems: "center"
        justifyContent: "space-between"
        gap: "1rem"
        minHeight: "4rem"
        boxSizing: "border-box"
      ".pt-nav-brand-row":
        display: "flex"
        alignItems: "center"
        gap: "1.5rem"
        minWidth: 0
        flex: 1
      ".pt-brand":
        fontSize: "1.125rem"
        fontWeight: "700"
        letterSpacing: "-0.02em"
        textDecoration: "none"
        color: "var(foreground)"
        whiteSpace: "nowrap"
      ".pt-nav-desktop":
        display: "none"
        alignItems: "center"
        gap: "0.25rem"
      ".pt-nav-link":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.5rem"
        padding: "0.5rem 0.875rem"
        borderRadius: "0.5rem"
        fontSize: "0.875rem"
        fontWeight: "500"
        textDecoration: "none"
        color: "var(muted)"
      ".pt-nav-link-active":
        backgroundColor: "var(card)"
        color: "var(foreground)"
      ".pt-nav-actions":
        display: "flex"
        alignItems: "center"
        gap: "0.5rem"
        flexShrink: 0
      ".pt-nav-actions-desktop":
        display: "none"
      ".pt-nav-menu-btn":
        display: "inline-flex"
      ".pt-nav-mobile":
        borderTopWidth: 1
        borderTopStyle: "solid"
        borderTopColor: "var(border)"
        padding: "1rem"
        backgroundColor: "var(bg)"
      ".pt-nav-mobile-tools":
        display: "flex"
        alignItems: "center"
        justifyContent: "space-between"
        gap: "0.75rem"
        paddingBottom: "1rem"
        marginBottom: "1rem"
        borderBottomWidth: 1
        borderBottomStyle: "solid"
        borderBottomColor: "var(border)"
      ".pt-nav-mobile-label":
        fontSize: "0.75rem"
        fontWeight: "700"
        textTransform: "uppercase"
        letterSpacing: "0.05em"
        color: "var(muted)"
      ".pt-nav-mobile-links":
        display: "flex"
        flexDirection: "column"
        gap: "0.5rem"
      ".pt-page":
        backgroundColor: "var(bg)"
        color: "var(foreground)"
        flex: 1
        minHeight: 0
      ".pt-container":
        maxWidth: "64rem"
        marginLeft: "auto"
        marginRight: "auto"
        padding: "2rem 1rem 3rem"
        width: "100%"
        boxSizing: "border-box"
      ".pt-header":
        marginBottom: "2rem"
      ".pt-title":
        fontSize: "clamp(1.75rem, 4vw, 2.5rem)"
        fontWeight: "800"
        letterSpacing: "-0.03em"
        margin: "0 0 0.75rem"
        lineHeight: "1.1"
      ".pt-lead":
        fontSize: "1.125rem"
        lineHeight: "1.6"
        margin: "0 0 1.5rem"
        maxWidth: "42rem"
      ".pt-muted":
        color: "var(muted)"
      ".pt-nav-chips":
        display: "flex"
        flexWrap: "wrap"
        gap: "0.75rem"
      ".pt-chip":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.5rem"
        padding: "0.5rem 0.875rem"
        boxSizing: "border-box"
        borderRadius: "9999px"
        fontSize: "0.875rem"
        fontWeight: "500"
        lineHeight: "1.25rem"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        textDecoration: "none"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
      ".pt-icon-btn":
        display: "inline-flex"
        alignItems: "center"
        justifyContent: "center"
        width: "2.625rem"
        height: "2.625rem"
        padding: 0
        boxSizing: "border-box"
        borderRadius: "9999px"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
        cursor: "pointer"
      ".pt-btn":
        display: "inline-flex"
        alignItems: "center"
        gap: "0.5rem"
        padding: "0.5rem 0.875rem"
        boxSizing: "border-box"
        borderRadius: "0.5rem"
        fontSize: "0.875rem"
        fontWeight: "600"
        fontFamily: "inherit"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        backgroundColor: "var(secondary)"
        color: "var(secondaryFg)"
        cursor: "pointer"
      ".pt-btn-primary":
        backgroundColor: "var(primary)"
        color: "var(primaryFg)"
        borderColor: "var(primary)"
      ".pt-input":
        flex: 1
        minWidth: 0
        padding: "0.625rem 0.875rem"
        fontSize: "1rem"
        fontFamily: "inherit"
        borderRadius: "0.5rem"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        backgroundColor: "var(card)"
        color: "var(foreground)"
        boxSizing: "border-box"
      ".pt-search-form":
        display: "flex"
        flexWrap: "wrap"
        gap: "0.75rem"
        marginBottom: "1.5rem"
      ".pt-error":
        color: "#dc2626"
        margin: "0 0 1rem"
      ".pt-result-list":
        listStyle: "none"
        margin: 0
        padding: 0
        display: "flex"
        flexDirection: "column"
        gap: "0.75rem"
      ".pt-result-item":
        margin: 0
      ".pt-result-link":
        display: "flex"
        flexDirection: "column"
        gap: "0.25rem"
        padding: "1rem"
        borderRadius: "0.5rem"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        backgroundColor: "var(card)"
        textDecoration: "none"
        color: "inherit"
      ".pt-result-title":
        fontWeight: "600"
      ".pt-result-path":
        fontSize: "0.8125rem"
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace"
      ".pt-card":
        backgroundColor: "var(card)"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        borderRadius: "0.5rem"
        padding: "1.5rem"
        marginBottom: "2rem"
      ".pt-section":
        marginBottom: "2rem"
      ".pt-section-title":
        fontSize: "1.25rem"
        fontWeight: "700"
        margin: "0 0 1rem"
        paddingBottom: "0.5rem"
        borderBottomWidth: 1
        borderBottomStyle: "solid"
        borderBottomColor: "var(border)"
      ".pt-event-list":
        listStyle: "none"
        margin: 0
        padding: 0
        display: "flex"
        flexDirection: "column"
        gap: "0.5rem"
      ".pt-event-item":
        display: "flex"
        flexDirection: "column"
        gap: "0.125rem"
        padding: "0.75rem 1rem"
        borderRadius: "0.5rem"
        borderWidth: 1
        borderStyle: "solid"
        borderColor: "var(border)"
        backgroundColor: "var(card)"
      ".pt-event-title":
        fontWeight: "600"
      ".pt-event-meta":
        fontSize: "0.8125rem"
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace"
      ".pt-article-page":
        display: "flex"
        flexDirection: "column"
        minHeight: 0
      ".pt-article-toolbar":
        display: "flex"
        flexWrap: "wrap"
        alignItems: "center"
        gap: "0.5rem"
        padding: "0.75rem 1rem"
        borderBottomWidth: 1
        borderBottomStyle: "solid"
        borderBottomColor: "var(border)"
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace"
        fontSize: "0.875rem"
        flexShrink: 0
      ".pt-article-path":
        flex: 1
        minWidth: 0
        wordBreak: "break-all"
      ".pt-article-body":
        flex: 1
        overflowY: "auto"
        padding: "1rem"
        maxWidth: "64rem"
        marginLeft: "auto"
        marginRight: "auto"
        width: "100%"
        boxSizing: "border-box"
      ".pt-footer":
        marginTop: "auto"
        padding: "1.5rem 1rem"
        borderTopWidth: 1
        borderTopStyle: "solid"
        borderTopColor: "var(border)"
        textAlign: "center"
        fontSize: "0.875rem"
      ".pt-link":
        color: "var(primary)"
        textDecoration: "none"
      ".pt-nav-desktop-md":
        display: "flex"
      ".pt-nav-actions-desktop-md":
        display: "flex"
      ".pt-nav-menu-btn-md":
        display: "none"
      ".pt-nav-mobile-md":
        display: "none"
  dark:
    inherits: light
    variables:
      bg: "#020817"
      foreground: "#f8fafc"
      card: "#020817"
      muted: "#94a3b8"
      primary: "#3b82f6"
      primaryFg: "#0b1220"
      secondary: "#1e293b"
      secondaryFg: "#f8fafc"
      border: "#1e293b"
      badgeActive: "#22c55e"
      badgePublished: "#3b82f6"
      badgePlanned: "#eab308"
current_theme: light
